name: Check skill and examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install -r requirements-html.txt
      - name: Check skill identity and links
        run: python3 scripts/check_skill.py
      - name: Run numerical example tests
        run: python3 -m unittest discover -s examples/tests -v
      - name: Check archive extraction behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check HTML build and interaction logic
        run: npm test
      - name: Build the HTML tutorial
        run: npm run build:learning
      - name: Audit the rendered tutorial at 1440 and 390px
        run: npm run audit:learning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-tutorial
          path: |
            build/tutorial.html
            build/audit/tutorial/report.json
            build/audit/tutorial/*-overview.png
            build/audit/tutorial/print.pdf
